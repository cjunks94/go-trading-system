run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Report suspicious constructs
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Static analysis
    - typecheck     # Type checking
    - unused        # Find unused code
    - gosec         # Security checks
    - goconst       # Find repeated strings
    - gocyclo       # Cyclomatic complexity
    - gofmt         # Check formatting
    - goimports     # Check imports
    - misspell      # Find misspellings
    - unconvert     # Remove unnecessary conversions
    - unparam       # Find unused parameters
    - nakedret      # Find naked returns
    - prealloc      # Find slice preallocation opportunities
    - copyloopvar   # Check for loop variable copies (Go 1.22+)

linters-settings:
  gocyclo:
    min-complexity: 15
  goconst:
    min-len: 3
    min-occurrences: 3
  misspell:
    locale: US
  gosec:
    excludes:
      - G104  # Unhandled errors (we use errcheck)
  nakedret:
    max-func-lines: 30

issues:
  exclude-rules:
    # Exclude test files from some checks
    - path: _test\.go
      linters:
        - gosec
        - goconst
        - gocyclo
    # Exclude generated files
    - path: mock_
      linters:
        - all
    # Allow math/rand in simulator (crypto-grade randomness not needed for price simulation)
    - path: feed_simulator\.go
      linters:
        - gosec
      text: "G404"

  max-issues-per-linter: 50
  max-same-issues: 10
