version: "3.9"

services:
  trading-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-trading-system
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=debug
      - PORT=8080
      - SYMBOLS=AAPL,GOOGL,MSFT,AMZN,TSLA,NFLX,META,NVDA
      - WORKERS=4
      - MAX_POSITION_SIZE=10000
      - MAX_ORDER_SIZE=1000
      - MAX_DAILY_LOSS=50000
      - DATABASE_URL=postgres://trading:trading@postgres:5432/trading?sslmode=disable
      - JWT_SECRET=dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: trading-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=trading
      - POSTGRES_PASSWORD=trading
      - POSTGRES_DB=trading
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
