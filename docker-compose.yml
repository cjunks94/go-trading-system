version: "3.9"

services:
  trading-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-trading-system
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=debug
      - PORT=8080
      - SYMBOLS=AAPL,GOOGL,MSFT,AMZN,TSLA,NFLX,META,NVDA
      - WORKERS=4
      - MAX_POSITION_SIZE=10000
      - MAX_ORDER_SIZE=1000
      - MAX_DAILY_LOSS=50000
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
